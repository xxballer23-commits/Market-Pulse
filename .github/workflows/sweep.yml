name: Sweep
# 6am, 12pm, 5pm Eastern (standard time). GitHub cron is UTC; during daylight time these land an hour later.
on:
  schedule:
    - cron: "0 11,17,22 * * *"
  workflow_dispatch: {}
  # Editing this file also starts a sweep (lets a commit trigger a run).
  push:
    branches: [main]
    paths: [".github/triggers/sweep"]

permissions:
  contents: write

concurrency:
  group: pulse-data
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: \"1\"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, tag and rebuild
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
        run: python -m pulse sweep
      - name: Commit data
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: sweep $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
      - name: Optional digest right after (push trigger file says daily, monday or friday)
        if: github.event_name == 'push'
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
        run: |
          kind=$(head -c 20 .github/triggers/sweep 2>/dev/null | tr -cd 'a-z')
          case "$kind" in daily|monday|friday|briefing) python -m pulse digest "$kind";; *) echo "sweep only";; esac
      - name: Commit digest
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: digest after sweep $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
