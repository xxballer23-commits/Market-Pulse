name: Team Desk
# Issue commands (repo owner and collaborators only, so strangers can't spend API credit):
#   Vet: Company        -> Diligence brief.  Body lines: "Requested by: Name", "Context: ..."
#   Watch: Company      -> add to shared Watchlist.  Body lines: "Requested by:", "Why:", "Category:"
#   Approve: <id|latest> -> curator marks an edition reviewed
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pulse-data
  cancel-in-progress: false

jobs:
  desk:
    if: >-
      startsWith(github.event.issue.title, 'Vet') || startsWith(github.event.issue.title, 'vet') ||
      startsWith(github.event.issue.title, 'Watch') || startsWith(github.event.issue.title, 'watch') ||
      startsWith(github.event.issue.title, 'Approve') || startsWith(github.event.issue.title, 'approve')
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: \"1\"
    timeout-minutes: 15
    steps:
      - name: Check requester
        id: auth
        env:
          ASSOC: ${{ github.event.issue.author_association }}
        run: |
          case "$ASSOC" in OWNER|COLLABORATOR|MEMBER) echo "ok=true" >> "$GITHUB_OUTPUT";; *) echo "ok=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v4
        if: steps.auth.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.auth.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Run command
        id: desk
        if: steps.auth.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python -m pulse desk-issue
      - name: Commit data
        if: steps.desk.outputs.action && steps.desk.outputs.action != 'none'
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: desk ${{ steps.desk.outputs.action }} (issue #${{ github.event.issue.number }})"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
      - name: Reply and close
        if: always() && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          ACTION: ${{ steps.desk.outputs.action }}
          MSG: ${{ steps.desk.outputs.message }}
          LINK: ${{ steps.desk.outputs.link }}
        run: |
          if [ -n "$ACTION" ] && [ "$ACTION" != "none" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$MSG ${LINK:+(the site can take a minute or two to refresh): $LINK}"
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY"
          else
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "${MSG:-Something went wrong, check the Actions log.}"
          fi
