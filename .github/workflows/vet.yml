name: Diligence Desk
# Open an issue titled "Vet: Company Name". Only the repo owner and collaborators can trigger it,
# so strangers on a public repo cannot spend your API credit.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pulse-data
  cancel-in-progress: false

jobs:
  vet:
    if: >-
      startsWith(github.event.issue.title, 'Vet') || startsWith(github.event.issue.title, 'vet')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check requester
        id: auth
        env:
          ASSOC: ${{ github.event.issue.author_association }}
        run: |
          case "$ASSOC" in OWNER|COLLABORATOR|MEMBER) echo "ok=true" >> "$GITHUB_OUTPUT";; *) echo "ok=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v4
        if: steps.auth.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.auth.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Write brief
        id: vet
        if: steps.auth.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python -m pulse vet-issue
      - name: Commit data
        if: steps.vet.outputs.vetted == 'true'
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: vet brief ${{ steps.vet.outputs.vet_id }}"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
      - name: Reply and close
        if: always() && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          VETTED: ${{ steps.vet.outputs.vetted }}
          VET_ID: ${{ steps.vet.outputs.vet_id }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$VETTED" = "true" ]; then
            url="https://${OWNER}.github.io/${REPO}/#/vet/${VET_ID}"
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "Brief is ready (the site can take a minute or two to refresh): $url"
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY"
          else
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "Could not write a brief. Use a title like \`Vet: Company Name\` and check the Actions log."
          fi
