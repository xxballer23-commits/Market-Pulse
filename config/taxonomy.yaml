  networks: [Visa, Mastercard]
  luxury: [LVMH, Hermes, Kering, Richemont, Chanel, Prada, Tapestry, Capri Holdings,
           Moncler, Burberry, Ferrari, Sotheby's, Christie's, Phillips]
  travel_hospitality: [Marriott, Hilton, Hyatt, IHG, Four Seasons, Aman, Rosewood,
                       Delta, United, American Airlines, Priority Pass, Plaza Premium]
  dining_experiences: [Resy, OpenTable, Tock, SevenRooms, Dorsia, Blackbird, Live Nation,
